<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparador de celulares</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--accent:#0b5cad;--danger:#a00000;--border:#c9ced6;--win:#e3f4e6;--head:#eef2f7}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:system-ui,sans-serif;margin:0;padding:1rem;background:var(--bg);color:var(--fg);line-height:1.5}
main{max-width:64rem;margin:auto}
fieldset,details{border:1px solid var(--border);border-radius:.5rem;padding:1rem;margin:0 0 1rem}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.item{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--border);padding:.5rem 0}
.item:last-child{border-bottom:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.75rem;margin-top:.75rem}
.card{border:1px solid var(--border);border-radius:.5rem;padding:.75rem;display:flex;flex-direction:column;gap:.5rem}
.card img,.ph{width:100%;height:9rem;object-fit:contain;background:var(--head);border-radius:.4rem}
.ph{display:flex;align-items:center;justify-content:center;font-size:2.5rem}
.card label{display:flex;align-items:center;gap:.5rem;min-height:44px;font-weight:700}
.acciones{display:flex;flex-wrap:wrap;gap:.4rem}
.acciones button{padding:.25rem .6rem;font-size:.9rem}
input[type=checkbox]{width:1.2rem;height:1.2rem}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.75rem;margin:.75rem 0}
.campos label{display:block;margin-bottom:.2rem}
.campos input,.fila input[type=text]{width:100%;min-height:44px;padding:.4rem .6rem;border:1px solid #6b7280;border-radius:.4rem;font:inherit}
.fila{display:flex;flex-wrap:wrap;gap:.5rem;align-items:flex-end;margin-bottom:.5rem}
.fila div{flex:1;min-width:12rem}
button,.boton{min-height:44px;padding:.5rem 1rem;border:2px solid var(--accent);border-radius:.4rem;background:var(--accent);color:#fff;font:inherit;cursor:pointer;display:inline-flex;align-items:center}
button.sec,.boton.sec{background:#fff;color:var(--accent)}
button.peligro{background:#fff;color:var(--danger);border-color:var(--danger)}
button[aria-pressed=true]{background:#fff3c4;color:#5c4400;border-color:#8a6a00}
.barra{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#aviso{min-height:1.5rem;font-weight:700}
#aviso.error{color:var(--danger)}
.tabla{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin-top:1rem}
th,td{border:1px solid var(--border);padding:.5rem .75rem;text-align:left}
thead th{background:var(--head)}
th img{display:block;width:4rem;height:4rem;object-fit:contain;margin-bottom:.25rem}
td.gana{background:var(--win);font-weight:700}
td.gana::before{content:"★ "}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media print{fieldset,details,.barra,#aviso{display:none}td.gana{background:none}}
</style>
</head>
<body>
<main>
<h1>Comparador de celulares</h1>

<div class="barra">
<button type="button" id="expJson">Exportar JSON</button>
<button type="button" id="expCsv" class="sec">Exportar CSV</button>
<label class="boton sec" for="importar">Importar JSON</label>
<input type="file" id="importar" accept="application/json,.json" class="sr">
<button type="button" id="reset" class="peligro">Restaurar originales</button>
</div>
<p id="aviso" role="status" aria-live="polite"></p>

<details id="detalle">
<summary>Agregar o editar celular</summary>
<form id="form">
<div class="campos"></div>
<div class="campos">
<div>
<label for="f-imagen">Imagen (JPG, PNG o WebP, opcional)</label>
<input type="file" id="f-imagen" accept="image/jpeg,image/png,image/webp">
</div>
</div>
<button type="submit" id="guardarCel">Guardar celular</button>
<button type="button" id="cancelar" class="sec" hidden>Cancelar edición</button>
</form>
</details>

<fieldset>
<legend>Celulares y galería</legend>
<label><input type="checkbox" id="soloFav"> Mostrar solo favoritos</label>
<div id="lista" class="grid"></div>
</fieldset>

<fieldset>
<legend>Comparativas guardadas</legend>
<div class="fila">
<div>
<label for="nombreComp">Nombre de la comparativa actual</label>
<input type="text" id="nombreComp" maxlength="80">
</div>
<button type="button" id="guardarComp">Guardar comparativa</button>
</div>
<label><input type="checkbox" id="soloFavComp"> Mostrar solo favoritas</label>
<div id="listaComps"></div>
</fieldset>

<div class="tabla" id="salida" aria-live="polite"></div>
</main>

<script>
const CLAVE="comparador-celulares-v2";
const CLAVE_V1="comparador-celulares-v1";
const IMG_RE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
const IMG_MAX=250000;
const base=[
{nombre:"Oppo Reno 14 (12/256)",chip:"Dimensity 8350",antutu:1300000,ram:12,almacenamiento:256,pantalla:6.59,hz:120,bateria:6000,carga:80,peso:187},
{nombre:"Huawei P30 Lite",chip:"Kirin 710",antutu:170000,ram:4,almacenamiento:128,pantalla:6.15,hz:60,bateria:3340,carga:18,peso:159},
{nombre:"Pixel 7 (8/128)",chip:"Tensor G2",antutu:750000,ram:8,almacenamiento:128,pantalla:6.3,hz:90,bateria:4355,carga:20,peso:197}
];
const campos=[
{k:"nombre",t:"Nombre",tipo:"text"},
{k:"chip",t:"Procesador",tipo:"text"},
{k:"antutu",t:"AnTuTu (aprox.)",tipo:"number"},
{k:"ram",t:"RAM (GB)",tipo:"number"},
{k:"almacenamiento",t:"Almacenamiento (GB)",tipo:"number"},
{k:"pantalla",t:"Pantalla (pulgadas)",tipo:"number",paso:"0.01"},
{k:"hz",t:"Refresco (Hz)",tipo:"number"},
{k:"bateria",t:"Batería (mAh)",tipo:"number"},
{k:"carga",t:"Carga (W)",tipo:"number"},
{k:"peso",t:"Peso (g)",tipo:"number"}
];
const filas=[
{k:"chip",t:"Procesador"},
{k:"antutu",t:"AnTuTu (aprox.)",mejor:"max",f:v=>v.toLocaleString("es-MX")},
{k:"ram",t:"RAM",mejor:"max",f:v=>v+" GB"},
{k:"almacenamiento",t:"Almacenamiento",mejor:"max",f:v=>v+" GB"},
{k:"pantalla",t:"Pantalla",f:v=>v+" pulgadas"},
{k:"hz",t:"Tasa de refresco",mejor:"max",f:v=>v+" Hz"},
{k:"bateria",t:"Batería",mejor:"max",f:v=>v+" mAh"},
{k:"carga",t:"Carga rápida",mejor:"max",f:v=>v+" W"},
{k:"peso",t:"Peso",mejor:"min",f:v=>v+" g"}
];

const $=id=>document.getElementById(id);
const lista=$("lista"),salida=$("salida"),avisoEl=$("aviso"),form=$("form"),importar=$("importar");
const soloFav=$("soloFav"),soloFavComp=$("soloFavComp"),listaComps=$("listaComps");
const nombreComp=$("nombreComp"),archivoImg=$("f-imagen");

function aviso(msg,error=false){
avisoEl.textContent=msg;
avisoEl.className=error?"error":"";
}

function validar(c){
if(!c||typeof c!=="object")return null;
const o={};
for(const f of campos){
const v=c[f.k];
if(f.tipo==="text"){
if(typeof v!=="string"||!v.trim())return null;
o[f.k]=v.trim().slice(0,80);
}else{
if(v===""||v===null||v===undefined)return null;
const n=Number(v);
if(!Number.isFinite(n)||n<0)return null;
o[f.k]=n;
}
}
o.fav=c.fav===true;
if(typeof c.imagen==="string"&&c.imagen.length<=IMG_MAX&&IMG_RE.test(c.imagen))o.imagen=c.imagen;
return o;
}

function validarComp(k){
if(!k||typeof k!=="object"||typeof k.nombre!=="string"||!k.nombre.trim()||!Array.isArray(k.celulares))return null;
const n=k.celulares.filter(x=>typeof x==="string").map(x=>x.slice(0,80)).slice(0,10);
if(n.length<2)return null;
return {nombre:k.nombre.trim().slice(0,80),celulares:n,fav:k.fav===true};
}

function leer(d){
const arr=Array.isArray(d)?d:d&&d.celulares;
const brutos=Array.isArray(arr)?arr:[];
const rawComp=d&&!Array.isArray(d)&&Array.isArray(d.comparativas)?d.comparativas:[];
const cel=brutos.map(validar).filter(Boolean);
const comp=rawComp.map(validarComp).filter(Boolean);
return {cel,comp,omitidos:brutos.length-cel.length+rawComp.length-comp.length};
}

function cargar(){
try{
const g=localStorage.getItem(CLAVE)||localStorage.getItem(CLAVE_V1);
if(g){
const r=leer(JSON.parse(g));
if(r.cel.length)return {celulares:r.cel,comparativas:r.comp};
}
}catch(e){}
return {celulares:structuredClone(base),comparativas:[]};
}

let {celulares,comparativas}=cargar();
const seleccion=new Set(celulares.slice(0,2).map(c=>c.nombre));
let editando=null;
let imagenNueva=null;

function guardar(){
try{
localStorage.setItem(CLAVE,JSON.stringify({celulares,comparativas}));
return true;
}catch(e){
aviso("No se pudo guardar: el navegador se quedó sin espacio. Exporta tu JSON y quita imágenes.",true);
return false;
}
}

function persistir(msg){
if(guardar()&&msg)aviso(msg);
}

function upsert(c){
const i=celulares.findIndex(y=>y.nombre.toLowerCase()===c.nombre.toLowerCase());
if(i>=0){
if(!c.imagen&&celulares[i].imagen)c.imagen=celulares[i].imagen;
celulares[i]=c;
}else celulares.push(c);
}

function descargar(nombre,texto,tipo){
const url=URL.createObjectURL(new Blob([texto],{type:tipo}));
const a=document.createElement("a");
a.href=url;
a.download=nombre;
document.body.append(a);
a.click();
a.remove();
URL.revokeObjectURL(url);
}

function celdaCsv(v){
let s=String(v);
if(/^[=+\-@]/.test(s))s="'"+s;
return '"'+s.replace(/"/g,'""')+'"';
}

function reducirImagen(file){
return new Promise((res,rej)=>{
if(!/^image\/(jpeg|png|webp)$/.test(file.type))return rej(new Error("usa JPG, PNG o WebP"));
const url=URL.createObjectURL(file);
const img=new Image();
img.onload=()=>{
const e=Math.min(1,480/Math.max(img.width,img.height));
const cv=document.createElement("canvas");
cv.width=Math.max(1,Math.round(img.width*e));
cv.height=Math.max(1,Math.round(img.height*e));
cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
URL.revokeObjectURL(url);
let d=cv.toDataURL("image/webp",0.8);
if(!d.startsWith("data:image/webp"))d=cv.toDataURL("image/jpeg",0.8);
res(d);
};
img.onerror=()=>{
URL.revokeObjectURL(url);
rej(new Error("no se pudo leer la imagen"));
};
img.src=url;
});
}

function boton(texto,clase,fn,label){
const b=document.createElement("button");
b.type="button";
b.className=clase;
b.textContent=texto;
if(label)b.setAttribute("aria-label",label);
b.addEventListener("click",fn);
return b;
}

function botonFav(x,fn){
const b=boton(x.fav?"★ Favorito":"☆ Favorito","sec",fn,"Favorito: "+x.nombre);
b.setAttribute("aria-pressed",String(!!x.fav));
return b;
}

function pintarLista(){
lista.replaceChildren();
const vis=celulares.filter(c=>!soloFav.checked||c.fav);
if(!vis.length){
lista.textContent="No hay celulares para mostrar.";
return;
}
vis.forEach(c=>{
const card=document.createElement("article");
card.className="card";
if(c.imagen){
const im=document.createElement("img");
im.src=c.imagen;
im.alt="";
card.append(im);
}else{
const ph=document.createElement("div");
ph.className="ph";
ph.setAttribute("aria-hidden","true");
ph.textContent="📱";
card.append(ph);
}
const l=document.createElement("label");
const cb=document.createElement("input");
cb.type="checkbox";
cb.checked=seleccion.has(c.nombre);
cb.addEventListener("change",()=>{
if(cb.checked)seleccion.add(c.nombre);else seleccion.delete(c.nombre);
render();
});
l.append(cb,c.nombre);
const a=document.createElement("div");
a.className="acciones";
a.append(
botonFav(c,()=>{
c.fav=!c.fav;
persistir();
pintarLista();
}),
boton("Editar","sec",()=>editar(c),"Editar "+c.nombre),
boton("Eliminar","peligro",()=>{
if(!confirm("¿Eliminar "+c.nombre+"?"))return;
celulares=celulares.filter(x=>x.nombre!==c.nombre);
seleccion.delete(c.nombre);
pintarLista();
render();
persistir("Eliminado: "+c.nombre);
},"Eliminar "+c.nombre)
);
card.append(l,a);
lista.append(card);
});
}

function pintarComps(){
listaComps.replaceChildren();
const vis=comparativas.filter(k=>!soloFavComp.checked||k.fav);
if(!vis.length){
listaComps.textContent="Aún no hay comparativas para mostrar.";
return;
}
vis.forEach(k=>{
const d=document.createElement("div");
d.className="item";
const t=document.createElement("div");
const n=document.createElement("strong");
n.textContent=k.nombre;
const s=document.createElement("div");
s.textContent=k.celulares.join(" vs ");
t.append(n,s);
const a=document.createElement("div");
a.className="acciones";
a.append(
boton("Cargar","sec",()=>cargarComp(k),"Cargar comparativa "+k.nombre),
botonFav(k,()=>{
k.fav=!k.fav;
persistir();
pintarComps();
}),
boton("Eliminar","peligro",()=>{
if(!confirm("¿Eliminar la comparativa "+k.nombre+"?"))return;
comparativas=comparativas.filter(x=>x!==k);
pintarComps();
persistir("Comparativa eliminada");
},"Eliminar comparativa "+k.nombre)
);
d.append(t,a);
listaComps.append(d);
});
}

function cargarComp(k){
const ok=k.celulares.filter(n=>celulares.some(c=>c.nombre===n));
if(ok.length<2){
aviso("Esa comparativa ya no tiene suficientes celulares",true);
return;
}
seleccion.clear();
ok.forEach(n=>seleccion.add(n));
pintarLista();
render();
aviso("Comparativa cargada: "+k.nombre+(ok.length<k.celulares.length?" (faltan algunos celulares)":""));
}

function render(){
const sel=celulares.filter(c=>seleccion.has(c.nombre));
salida.replaceChildren();
if(sel.length<2){
salida.textContent="Elige al menos 2 celulares para comparar.";
return;
}
const tabla=document.createElement("table");
const cap=tabla.createCaption();
cap.className="sr";
cap.textContent="Comparativa de celulares";
const hr=tabla.createTHead().insertRow();
const th0=document.createElement("th");
th0.scope="col";
th0.textContent="Característica";
hr.append(th0);
sel.forEach(c=>{
const th=document.createElement("th");
th.scope="col";
if(c.imagen){
const im=document.createElement("img");
im.src=c.imagen;
im.alt="";
th.append(im);
}
th.append(c.nombre);
hr.append(th);
});
const tb=tabla.createTBody();
filas.forEach(f=>{
const tr=tb.insertRow();
const th=document.createElement("th");
th.scope="row";
th.textContent=f.t;
tr.append(th);
const vals=sel.map(c=>c[f.k]);
const best=f.mejor?(f.mejor==="max"?Math.max(...vals):Math.min(...vals)):null;
const empate=best!==null&&vals.every(v=>v===best);
sel.forEach(c=>{
const v=c[f.k];
const td=tr.insertCell();
td.textContent=f.f?f.f(v):v;
if(best!==null&&v===best&&!empate){
td.className="gana";
const s=document.createElement("span");
s.className="sr";
s.textContent=" (mejor)";
td.append(s);
}
});
});
salida.append(tabla);
}

const contCampos=form.querySelector(".campos");
campos.forEach(f=>{
const w=document.createElement("div");
const l=document.createElement("label");
l.htmlFor="f-"+f.k;
l.textContent=f.t;
const i=document.createElement("input");
i.id="f-"+f.k;
i.name=f.k;
i.type=f.tipo;
i.required=true;
if(f.tipo==="number"){
i.min="0";
i.step=f.paso||"1";
i.inputMode="decimal";
}
w.append(l,i);
contCampos.append(w);
});

function editar(c){
editando=c.nombre;
imagenNueva=null;
archivoImg.value="";
campos.forEach(f=>{$("f-"+f.k).value=c[f.k];});
$("guardarCel").textContent="Actualizar celular";
$("cancelar").hidden=false;
$("detalle").open=true;
$("f-nombre").focus();
}

function salirEdicion(){
editando=null;
imagenNueva=null;
form.reset();
archivoImg.value="";
$("guardarCel").textContent="Guardar celular";
$("cancelar").hidden=true;
}

archivoImg.addEventListener("change",async()=>{
const f=archivoImg.files[0];
imagenNueva=null;
if(!f)return;
try{
const d=await reducirImagen(f);
if(d.length>IMG_MAX)throw new Error("la imagen sigue muy pesada");
imagenNueva=d;
aviso("Imagen lista");
}catch(err){
archivoImg.value="";
aviso("Error con la imagen: "+err.message,true);
}
});

form.addEventListener("submit",e=>{
e.preventDefault();
const c=validar(Object.fromEntries(new FormData(form)));
if(!c){
aviso("Revisa los datos del formulario",true);
return;
}
const previo=celulares.find(x=>x.nombre===(editando||c.nombre));
c.fav=previo?previo.fav:false;
if(imagenNueva)c.imagen=imagenNueva;
else if(previo&&previo.imagen)c.imagen=previo.imagen;
if(editando&&editando!==c.nombre){
celulares=celulares.filter(x=>x.nombre!==editando);
comparativas.forEach(k=>{k.celulares=k.celulares.map(n=>n===editando?c.nombre:n);});
seleccion.delete(editando);
}
upsert(c);
seleccion.add(c.nombre);
salirEdicion();
pintarLista();
pintarComps();
render();
persistir("Guardado: "+c.nombre);
});

$("cancelar").addEventListener("click",()=>{
salirEdicion();
aviso("Edición cancelada");
});

$("guardarComp").addEventListener("click",()=>{
const nom=nombreComp.value.trim();
const nombres=celulares.filter(c=>seleccion.has(c.nombre)).map(c=>c.nombre);
if(!nom){
aviso("Ponle nombre a la comparativa",true);
nombreComp.focus();
return;
}
if(nombres.length<2){
aviso("Selecciona al menos 2 celulares",true);
return;
}
const i=comparativas.findIndex(k=>k.nombre.toLowerCase()===nom.toLowerCase());
const nueva={nombre:nom.slice(0,80),celulares:nombres,fav:i>=0?comparativas[i].fav:false};
if(i>=0)comparativas[i]=nueva;else comparativas.push(nueva);
nombreComp.value="";
pintarComps();
persistir("Comparativa guardada: "+nueva.nombre);
});

soloFav.addEventListener("change",pintarLista);
soloFavComp.addEventListener("change",pintarComps);

$("expJson").addEventListener("click",()=>{
descargar("celulares.json",JSON.stringify({version:2,celulares,comparativas},null,2),"application/json");
aviso("Exportado celulares.json");
});

$("expCsv").addEventListener("click",()=>{
const cols=[...campos.map(f=>f.k),"favorito"];
const enc=cols.map(celdaCsv).join(",");
const cuerpo=celulares.map(c=>[...campos.map(f=>c[f.k]),c.fav?"si":"no"].map(celdaCsv).join(",")).join("\n");
descargar("celulares.csv","\ufeff"+enc+"\n"+cuerpo,"text/csv;charset=utf-8");
aviso("Exportado celulares.csv");
});

importar.addEventListener("change",async()=>{
const f=importar.files[0];
if(!f)return;
try{
if(f.size>5000000)throw new Error("el archivo pesa más de 5 MB");
const r=leer(JSON.parse(await f.text()));
if(!r.cel.length&&!r.comp.length)throw new Error("no hay datos válidos");
r.cel.forEach(upsert);
r.comp.forEach(k=>{
const i=comparativas.findIndex(x=>x.nombre.toLowerCase()===k.nombre.toLowerCase());
if(i>=0)comparativas[i]=k;else comparativas.push(k);
});
pintarLista();
pintarComps();
render();
persistir("Importados "+r.cel.length+" celulares y "+r.comp.length+" comparativas"+(r.omitidos?" ("+r.omitidos+" omitidos por datos inválidos)":""));
}catch(e){
aviso("Error al importar: "+e.message,true);
}
importar.value="";
});

$("reset").addEventListener("click",()=>{
if(!confirm("¿Restaurar la lista original? Se borran celulares, favoritos, imágenes y comparativas."))return;
celulares=structuredClone(base);
comparativas=[];
seleccion.clear();
celulares.slice(0,2).forEach(c=>seleccion.add(c.nombre));
salirEdicion();
pintarLista();
pintarComps();
render();
persistir("Lista restaurada");
});

pintarLista();
pintarComps();
render();
</script>
</body>
</html>
